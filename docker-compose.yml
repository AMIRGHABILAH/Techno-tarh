services:
  db:
    image: postgres:15-alpine
    container_name: bizcard_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - bizcard_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizcard_backend
    restart: always
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - bizcard_network
    command: >
      sh -c "while ! nc -z db 5432; do sleep 1; done;
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: bizcard_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles  # ← تغییر مهم
      - media_volume:/app/media
    depends_on:
      - backend
    networks:
      - bizcard_network

networks:
  bizcard_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
