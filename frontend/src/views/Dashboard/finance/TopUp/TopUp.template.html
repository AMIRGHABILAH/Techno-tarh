<div >
  <MainLayout>
    <div class="topup-container">
      <h2>افزایش موجودی کیف پول</h2>

      <div class="wallet-box" v-if="walletLoaded">
        <span>موجودی فعلی:</span>
        <strong>{{ formatPrice(wallet.balance) }} ریال</strong>
      </div>

      <form @submit.prevent="submitTopUp" class="topup-form">
        <label for="amount">مبلغ شارژ (ریال):</label>

        <input
          id="amount"
          type="number"
          min="1000"
          v-model="amount"
          placeholder="مثلاً 500000"
          required
        />

        <button type="submit" :disabled="loading">
          <span v-if="loading">در حال پردازش...</span>
          <span v-else>شارژ حساب</span>
        </button>
      </form>

      <p class="success" v-if="successMsg">{{ successMsg }}</p>
      <p class="error" v-if="errorMsg">{{ errorMsg }}</p>
    </div>
  </MainLayout>
</div>
